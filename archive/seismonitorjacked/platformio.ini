; SeisMonitor Jacked — Landscape UI
; ESP32-S3 (QDTFT ES3C28P) + 2.8" IPS ILI9341V, landscape rotation
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200

[env:seismonitorjacked]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM11
monitor_port = COM11

lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git
    bblanchon/ArduinoJson@^7.3.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; ── TFT_eSPI: bypass include mechanism, define all settings here ──
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_MISO=13
    -DTFT_DC=46
    '-DTFT_RST=-1'
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
